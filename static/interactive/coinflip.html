<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PRISM — Coin Flip</title>
<!-- ============================================================
   PRISM — Coin Flip / 50-50 overlay
   Matches the PRISM scene set (prism-theme.css tokens inlined so
   this file is self-contained wherever it's hosted).

   Add to OBS as a Browser Source, 1920x1080, transparent, above
   your scene. It shows nothing until a flip is triggered
   (chat !coinflip / !5050, a channel-point redeem, or the
   dashboard test button), then a holo card rises in, the coin
   spins, and the result shimmers in.

   Poll source: GET /api/effects/coinflip?since=<id>
   Test layout with ?demo on the URL.
   ============================================================ -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap');
:root{
  --ink:#EAF0FF; --ink-soft:#A9B4D6;
  --glass:rgba(14,16,28,0.46); --glass-deep:rgba(10,12,22,0.72);
  --c1:#57F2E4; --c2:#6C8BFF; --c3:#B983FF; --c4:#FF7ACb; --c5:#FFD86B;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ width:100%; height:100%; overflow:hidden; background:transparent;
  font-family:'Space Grotesk','Segoe UI',Arial,sans-serif; -webkit-font-smoothing:antialiased; }
.stage{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }

/* holo card */
.card{ position:relative; width:520px; padding:2px; border-radius:28px; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; gap:8px;
  background:linear-gradient(var(--glass),var(--glass)) padding-box,
    linear-gradient(120deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5),var(--c1)) border-box;
  background-size:100% 100%,320% 100%; border:1.6px solid transparent;
  -webkit-backdrop-filter:blur(18px) saturate(150%); backdrop-filter:blur(18px) saturate(150%);
  box-shadow:0 24px 60px rgba(0,0,0,0.55), 0 0 30px rgba(120,140,255,0.16);
  opacity:0; transform:translateY(60px) scale(0.94); pointer-events:none;
  animation:flow 12s linear infinite;
  transition:opacity 0.55s ease, transform 0.6s cubic-bezier(0.16,1,0.3,1); }
.card.show{ opacity:1; transform:translateY(0) scale(1); }
.card-inner{ display:flex; flex-direction:column; align-items:center; gap:22px;
  width:100%; padding:44px 40px 38px; border-radius:26px; background:var(--glass-deep); }

.eyebrow{ display:inline-flex; align-items:center; gap:10px; font-size:14px; font-weight:700;
  letter-spacing:5px; text-transform:uppercase; color:var(--c1); text-shadow:0 0 12px rgba(87,242,228,0.5); }
.eyebrow .dot{ width:9px; height:9px; border-radius:50%; background:var(--c1);
  box-shadow:0 0 8px var(--c1),0 0 16px var(--c1); animation:blip 1.4s ease-in-out infinite; }
.card.lose .eyebrow{ color:var(--c4); text-shadow:0 0 12px rgba(255,122,203,0.55); }
.card.lose .eyebrow .dot{ background:var(--c4); box-shadow:0 0 8px var(--c4),0 0 16px var(--c4); }

/* the coin */
.scene{ perspective:1000px; }
.coin{ width:190px; height:190px; position:relative; transform-style:preserve-3d; transform:rotateY(0deg); }
.coin.flipping{ animation:flip 2.1s cubic-bezier(.15,.62,.2,1) forwards; }
@keyframes flip{
  0%{ transform:rotateY(0) translateY(0); }
  45%{ transform:rotateY(1440deg) translateY(-118px); }
  100%{ transform:rotateY(3600deg) translateY(0); } }
.face{ position:absolute; inset:0; border-radius:50%; backface-visibility:hidden;
  display:flex; align-items:center; justify-content:center;
  font-family:'JetBrains Mono',monospace; font-weight:700; font-size:30px; letter-spacing:1px;
  color:#EAF0FF; text-shadow:0 0 16px rgba(150,180,255,0.7);
  background:conic-gradient(from 210deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5),var(--c1));
  box-shadow:0 12px 34px rgba(0,0,0,0.5), inset 0 0 0 8px rgba(10,12,22,0.55),
             inset 0 0 30px rgba(150,180,255,0.35); }
.face .inner{ width:calc(100% - 26px); height:calc(100% - 26px); border-radius:50%;
  display:flex; align-items:center; justify-content:center; background:rgba(9,11,20,0.72);
  box-shadow:inset 0 0 24px rgba(120,150,255,0.25); }
.back{ transform:rotateY(180deg); }

/* result text */
.result{ font-size:64px; font-weight:700; letter-spacing:2px; line-height:1.1; min-height:1.1em;
  background:linear-gradient(100deg,var(--c1),var(--c2) 22%,#ffffff 46%,#ffffff 56%,var(--c3) 80%,var(--c4));
  background-size:250% 100%;
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 26px rgba(140,170,255,0.35))
         drop-shadow(1.2px 0 0 rgba(255,122,203,0.26))
         drop-shadow(-1.2px 0 0 rgba(87,242,228,0.26));
  animation:shimmer 7s linear infinite; opacity:0; transform:translateY(10px); transition:opacity .4s, transform .4s; }
.result.in{ opacity:1; transform:translateY(0); }
.card.lose .result{ background:linear-gradient(100deg,var(--c4),#ffffff 45%,var(--c3),var(--c4)); background-size:250% 100%;
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }

.who{ display:inline-flex; align-items:center; gap:10px; padding:8px 22px; border-radius:999px;
  font-size:19px; letter-spacing:0.5px; color:var(--ink); opacity:0; transition:opacity .4s .1s;
  background:linear-gradient(rgba(13,15,26,0.85),rgba(13,15,26,0.85)) padding-box,
    linear-gradient(120deg,var(--c1),var(--c3),var(--c4)) border-box;
  background-size:100% 100%,240% 100%; border:1.5px solid transparent; animation:flow 10s linear infinite; }
.who.in{ opacity:1; }
.who b{ font-weight:700; color:#fff; }

@keyframes flow{ 0%{background-position:0% 50%} 100%{background-position:320% 50%} }
@keyframes shimmer{ 0%{background-position:0% 0%} 100%{background-position:250% 0%} }
@keyframes blip{ 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.35;transform:scale(0.8)} }
@media (prefers-reduced-motion: reduce){
  .card,.face,.who{ animation:none !important; } .coin.flipping{ animation-duration:0.6s !important; } }
</style>
</head>
<body>
<div class="stage">
  <div class="card" id="card">
    <div class="card-inner">
      <div class="eyebrow"><span class="dot"></span><span id="eyebrow">Coin Flip</span></div>
      <div class="scene"><div class="coin" id="coin">
        <div class="face front"><span class="inner" id="front">?</span></div>
        <div class="face back"><span class="inner" id="back">?</span></div>
      </div></div>
      <div class="result" id="result"></div>
      <div class="who" id="who" style="display:none"></div>
    </div>
  </div>
</div>

<script src="fx.js"></script>
<script>
(function(){
  "use strict";
  var CHANNEL="coinflip", POLL_MS=700;
  var lastId=0, busy=false, queue=[];
  var card=document.getElementById("card"), coin=document.getElementById("coin"),
      front=document.getElementById("front"), back=document.getElementById("back"),
      result=document.getElementById("result"), who=document.getElementById("who"),
      eyebrow=document.getElementById("eyebrow");

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function play(d){
    return new Promise(function(res){
      var is5050 = d.type==="5050";
      var out = d.result || (Math.random()<0.5?"HEADS":"TAILS");
      front.textContent = out; back.textContent = out;   // whichever face lands reads right
      card.classList.remove("lose");
      if(is5050 && !d.win) card.classList.add("lose");
      eyebrow.textContent = is5050 ? "50 / 50" : "Coin Flip";

      result.classList.remove("in"); result.textContent="";
      who.classList.remove("in"); who.style.display="none";
      card.classList.add("show");
      coin.classList.remove("flipping"); void coin.offsetWidth; coin.classList.add("flipping");
      if(window.SMFX) SMFX.tick();

      setTimeout(function(){
        if(window.SMFX){ is5050 ? (d.win ? SMFX.fanfare() : SMFX.lose()) : SMFX.win(); }
        result.textContent = is5050 ? (d.win?"WIN!":"LOSE") : out+"!";
        result.classList.add("in");
        if(d.user){ who.innerHTML = "for <b>"+esc(d.user)+"</b>"; who.style.display="inline-flex";
          requestAnimationFrame(function(){ who.classList.add("in"); }); }
      }, 2100);

      setTimeout(function(){ card.classList.remove("show"); }, 5400);
      setTimeout(res, 6000);
    });
  }
  function pump(){ if(busy||!queue.length) return; busy=true; play(queue.shift()).then(function(){ busy=false; pump(); }); }

  function poll(){
    fetch("/api/effects/"+CHANNEL+"?since="+lastId,{cache:"no-store"})
      .then(function(r){ return r.json(); })
      .then(function(d){ lastId=(d.last_id!=null?d.last_id:lastId);
        (d.events||[]).forEach(function(ev){ queue.push(ev.data); }); pump(); })
      .catch(function(){})
      .finally(function(){ setTimeout(poll, POLL_MS); });
  }

  if(new URLSearchParams(location.search).has("demo")){
    queue.push({type:"coin", result:"HEADS", user:"PixelWitch"});
    setTimeout(function(){ queue.push({type:"5050", result:"LOSE", win:false, user:"NeoTheFox98"}); pump(); }, 7000);
  }
  poll();
})();
</script>
</body>
</html>
