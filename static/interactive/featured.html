<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PRISM — Featured Viewers</title>
<!-- ============================================================
   PRISM — Featured Viewers (Lucky Wheel → "Featured Viewer")
   Replaces the hand-placed image sources on Starting Soon. Shows the
   last few winners' Twitch avatars, themed by the active PRISM set.
   OBS Browser Source, 1920x1080, transparent. Place it on Starting Soon.
   Data: GET /api/featured, live updates via /api/effects/featured.
   Preview with ?demo.
   ============================================================ -->
<style>
@import url('/overlays/PRISM/fonts/prism-fonts.css');   /* vendored — no network at load */
:root{
  --ink:#EAF0FF; --ink-soft:#A9B4D6;
  --glass:rgba(14,16,28,0.46); --glass-deep:rgba(10,12,22,0.72);
  --c1:#57F2E4; --c2:#6C8BFF; --c3:#B983FF; --c4:#FF7ACb; --c5:#FFD86B;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ width:100%; height:100%; overflow:hidden; background:transparent;
  font-family:'Space Grotesk','Segoe UI',Arial,sans-serif; -webkit-font-smoothing:antialiased; }
/* bottom-right block; move the OBS source to reposition */
.feat{ position:absolute; right:64px; bottom:64px; display:flex; flex-direction:column; align-items:flex-end; gap:16px; }
.feat[hidden]{ display:none; }
.feat-title{ font-size:22px; font-weight:700; letter-spacing:6px; text-transform:uppercase; color:var(--c1);
  text-shadow:0 0 12px rgba(87,242,228,0.5); }
.feat-list{ display:flex; gap:18px; }
.fv{ display:flex; flex-direction:column; align-items:center; gap:10px; width:210px; padding:18px 12px 16px;
  border-radius:24px; border:1.6px solid transparent;
  background:linear-gradient(var(--glass-deep),var(--glass-deep)) padding-box,
    linear-gradient(120deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5)) border-box;
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  box-shadow:0 18px 40px rgba(0,0,0,0.45); animation:fvIn .6s cubic-bezier(.16,1,.3,1) backwards; }
.fv img, .fv .fv-letter{ width:110px; height:110px; border-radius:50%; object-fit:cover; display:block;
  background:#1a1d2e; box-shadow:0 0 0 3px rgba(150,180,255,0.35); }
.fv .fv-letter{ display:flex; align-items:center; justify-content:center; font-size:46px; font-weight:700; color:var(--ink); }
.fv-name{ font-size:22px; font-weight:700; color:var(--ink); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fv.new{ animation:fvIn .6s cubic-bezier(.16,1,.3,1) backwards, fvGlow 2.4s ease-in-out 2; }
@keyframes fvIn{ from{ opacity:0; transform:translateY(24px) scale(.94); } }
@keyframes fvGlow{ 50%{ box-shadow:0 18px 40px rgba(0,0,0,0.45), 0 0 34px rgba(87,242,228,0.55); } }
@media (prefers-reduced-motion: reduce){ .fv{ animation:none !important; } }
</style>
<!-- Set theme: follows the set chosen in the Stream Manager dashboard, exactly
     like shoutout.html. Every set ships redeem-theme.css (holo's is empty, which
     leaves the built-in look); it is re-read every 60s so a set switch restyles
     this source without an OBS refresh. A failed load keeps the current theme.
     ?theme=<url> overrides it for previewing. -->
<link rel="stylesheet" id="prism-theme" href="/overlays/active/redeem-theme.css">
<script data-prism-theme>
(function(){
  var q = new URLSearchParams(location.search).get('theme');
  var BASE = q || '/overlays/active/redeem-theme.css';
  var cur = document.getElementById('prism-theme');
  function fresh(){ return BASE + (BASE.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now(); }
  cur.href = fresh();   /* never trust a cached copy from before a set switch */
  function swap(){
    var n = document.createElement('link');
    n.rel = 'stylesheet'; n.href = fresh();
    n.onload = function(){ if (cur && cur.parentNode) cur.parentNode.removeChild(cur); cur = n; };
    n.onerror = function(){ if (n.parentNode) n.parentNode.removeChild(n); };
    document.head.appendChild(n);
  }
  setInterval(swap, 60000);
})();
</script>
</head>
<body class="ov ov-featured">
<div class="feat" id="feat" hidden>
  <div class="feat-title" id="feat-title">Featured Viewers</div>
  <div class="feat-list" id="list"></div>
</div>
<script>
(function(){
  "use strict";
  var box=document.getElementById("feat"), list=document.getElementById("list"), lastId=0;
  function render(rows, fresh){
    list.textContent="";
    (rows||[]).slice().reverse().forEach(function(v){
      var card=document.createElement("div"); card.className="fv"+(v.login===fresh?" new":"");
      if(v.avatar){ var img=document.createElement("img"); img.alt=""; img.src=v.avatar;
        img.onerror=function(){ img.replaceWith(letter(v)); }; card.appendChild(img); }
      else card.appendChild(letter(v));
      var n=document.createElement("div"); n.className="fv-name"; n.textContent=v.name||v.login||"?";
      card.appendChild(n); list.appendChild(card);
    });
    box.hidden=!(rows&&rows.length);
  }
  function letter(v){ var d=document.createElement("div"); d.className="fv-letter";
    d.textContent=String(v.name||v.login||"?").charAt(0).toUpperCase(); return d; }
  var demo=new URLSearchParams(location.search).has("demo");
  if(demo){ render([{name:"PixelWitch",login:"pixelwitch"},{name:"NeoTheFox98",login:"neo"},{name:"GalaxyHusky",login:"gh"}],"gh"); return; }
  fetch("/api/featured",{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){ render(d.viewers); }).catch(function(){});
  function poll(){
    fetch("/api/effects/featured?since="+lastId,{cache:"no-store"})
      .then(function(r){return r.json();})
      .then(function(d){ lastId=(d.last_id!=null?d.last_id:lastId);
        var evs=d.events||[]; if(evs.length){ var e=evs[evs.length-1].data; render(e.viewers, e["new"]); } })
      .catch(function(){})
      .finally(function(){ setTimeout(poll, 700); });
  }
  poll();
})();
</script>
</body>
</html>
